<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Auto Next Lesson</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      width: 220px;
      margin: 0;
      padding: 16px;
      color: #1a1a1a;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 12px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    label {
      font-size: 13px;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
      flex-shrink: 0;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #ccc;
      transition: 0.2s;
      border-radius: 22px;
    }
    .slider::before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.2s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #1a73e8;
    }
    input:checked + .slider::before {
      transform: translateX(18px);
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #555;
    }
  </style>
</head>
<body>
  <h1>Auto Next Lesson</h1>
  <div class="row">
    <label for="enabled-toggle">Enabled</label>
    <span class="switch">
      <input type="checkbox" id="enabled-toggle" />
      <span class="slider"></span>
    </span>
  </div>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
