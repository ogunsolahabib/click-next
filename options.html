<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Auto Next Lesson — Options</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 480px;
      margin: 24px;
      color: #1a1a1a;
    }
    h1 {
      font-size: 18px;
      margin-bottom: 4px;
    }
    p.hint {
      color: #555;
      font-size: 13px;
      margin-top: 0;
    }
    label {
      display: block;
      font-weight: 600;
      margin-top: 16px;
      margin-bottom: 4px;
      font-size: 13px;
    }
    label .sub {
      display: block;
      font-weight: 400;
      color: #666;
      font-size: 12px;
      margin-top: 2px;
    }
    input[type="text"],
    input[type="number"],
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      font-size: 13px;
      font-family: inherit;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    textarea {
      resize: vertical;
      min-height: 72px;
    }
    button {
      margin-top: 20px;
      padding: 8px 16px;
      font-size: 13px;
      border: none;
      border-radius: 4px;
      background: #1a73e8;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background: #1558b0;
    }
    #status {
      margin-top: 12px;
      font-size: 13px;
      color: #188038;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <h1>Auto Next Lesson — Options</h1>
  <p class="hint">Changes take effect on the next page load — no need to reload the extension.</p>

  <form id="options-form">
    <label for="allowedHostnames">
      Allowed hostnames
      <span class="sub">One per line. Leave empty to run on any site.</span>
    </label>
    <textarea id="allowedHostnames" name="allowedHostnames"></textarea>

    <label for="timerLabelText">
      Timer label text
      <span class="sub">Text preceding the HH:MM:SS countdown, e.g. "TIME REMAINING".</span>
    </label>
    <input type="text" id="timerLabelText" name="timerLabelText" />

    <label for="nextButtonText">
      Next button text
      <span class="sub">Text (or substring) shown on the button to click, e.g. "Next Lesson".</span>
    </label>
    <input type="text" id="nextButtonText" name="nextButtonText" />

    <label for="pollIntervalMs">
      Poll interval (ms)
      <span class="sub">How often the page is scanned for the timer.</span>
    </label>
    <input type="number" id="pollIntervalMs" name="pollIntervalMs" min="100" step="100" />

    <button type="submit">Save</button>
    <div id="status"></div>
  </form>

  <script src="options.js"></script>
</body>
</html>
